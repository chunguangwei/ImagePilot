# 注意：GitHub 仅在「默认分支」上存在本文件时，Actions 页才会显示 "Run workflow" 按钮。
# 若只在 macos-support 等分支有改动，需合并到 main/master 后按钮才会出现。
name: ImageClassifier Multi-Platform Build

on:
  push:
    branches: [ main, master, macos-support ]
  pull_request:
    branches: [ main, master, macos-support ]
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以支持 git diff before/after 和 HEAD^

      - name: Determine build matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual dispatch - build all platforms
            echo "matrix={\"platform\":[\"macos\", \"windows\", \"android\"]}" >> $GITHUB_OUTPUT
          else
            # Automated trigger - only build platforms that changed
            changed_files=""
            
            # Try different methods to get changed files, with error handling
            if [ "${{ github.event_name }}" == "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              # Use github.event.before/after for push events (most reliable)
              echo "Using github.event.before/after for changed files"
              changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} 2>&1) || changed_files=""
            elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              # Fallback to HEAD^ if it exists
              echo "Using HEAD^ for changed files"
              changed_files=$(git diff --name-only HEAD^ HEAD 2>&1) || changed_files=""
            else
              # Last resort: check all files in current commit
              echo "Using git diff-tree for changed files (fallback)"
              changed_files=$(git diff-tree --no-commit-id --name-only -r HEAD 2>&1) || changed_files=""
            fi
            
            # If all methods failed, default to building all platforms
            if [ -z "$changed_files" ] || [ $? -ne 0 ]; then
              echo "Warning: Could not determine changed files, building all platforms"
              changed_files=""
            else
              echo "Changed files:"
              echo "$changed_files"
            fi
            
            declare -a platforms=()
            
            if [ -n "$changed_files" ]; then
              if echo "$changed_files" | grep -q "pc-version-final/"; then
                platforms+=("macos" "windows")
              fi
              
              if echo "$changed_files" | grep -q "android/"; then
                platforms+=("android")
              fi
            fi
            
            # Default to all platforms if no specific changes detected or if detection failed
            if [ ${#platforms[@]} -eq 0 ]; then
              echo "No platform-specific changes detected, building all platforms"
              platforms=("macos" "windows" "android")
            fi
            
            # Convert to JSON format
            matrix_json="{\"platform\":["
            for i in "${!platforms[@]}"; do
              if [ $i -gt 0 ]; then
                matrix_json="$matrix_json,"
              fi
              matrix_json="$matrix_json\"${platforms[$i]}\""
            done
            matrix_json="$matrix_json]}"
            
            echo "Final build matrix: $matrix_json"
            echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          fi

  build:
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write  # 创建 Release 和上传制品需要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display artifacts
        run: |
          echo "Available artifacts:"
          find ./artifacts -type f -name "*.*"

      - name: Prepare release files (flatten, avoid duplicates)
        run: |
          mkdir -p ./release
          find ./artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.apk" -o -name "*.appx" \) -exec cp {} ./release/ \;
          echo "Release files:"
          ls -la ./release/

      # 护栏：若该版本号的 Release 已存在则跳过发布，避免未 bump 版本号合 main 时
      # 覆盖已发布产物。需要发版时先 bump package.json 版本号（tag 不存在即正常发布）。
      - name: Check if release already exists
        id: rel-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Release v$VERSION 已存在 → 跳过发布（不覆盖已发布产物）。如需发版请先 bump 版本号。"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v$VERSION 不存在 → 将正常创建。"
          fi

      - name: Create Release
        if: steps.rel-check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2.4.2
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          name: Release v${{ steps.get-version.outputs.version }}
          allow_updates: true
          body: |
            Automatic release for ImageClassifier v${{ steps.get-version.outputs.version }}
            
            ## Changes
            - Automated build from commit ${{ github.sha }}
            
            ## Platforms
            - macOS Universal (DMG and ZIP)
            - Windows (NSIS Installer, Portable, APPX)
            - Android (APK)
          draft: false
          prerelease: false
          files: ./release/*