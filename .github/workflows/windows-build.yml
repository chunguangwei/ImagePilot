name: Windows Build

# Windows 构建现在生成多个独立的制品，不再使用单一的 artifact_paths
# 制品名称: windows-nsis-installer, windows-portable, windows-appx-unsigned, windows-appx-signed
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

jobs:
  # 不再使用单一的 artifact_paths，而是生成多个独立的制品
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # canvas@2.11.2 不兼容 Node 24（node-gyp 编译失败）；先留在 20。
          # 待 desktop 升级 canvas → 3.x 后可与 Android/macOS 一起升 24。
          node-version: '20'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            pc-version-final/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install system dependencies (GTK2-Runtime for node-canvas)
        run: |
          # --allow-empty-checksums：libjpeg-turbo 这个 choco 包从 sourceforge 拉 .exe 且未带
          # checksum；Chocolatey v1+ 默认禁止空校验和的非安全源安装 → 构建报错。该包无人维护，
          # 加此开关放行（仅影响这几个系统依赖的安装，不影响产物）。
          choco install -y --allow-empty-checksums pkgconfiglite gtk-runtime libjpeg-turbo

      - name: Prepare build environment
        run: |
          cd pc-version-final
          npm ci --no-optional --legacy-peer-deps
          $gtkRoot = "C:\Program Files (x86)\Gtk2-Runtime"
          if (-not (Test-Path $gtkRoot)) { $gtkRoot = "C:\GTK" }
          $env:GTK_Root = $gtkRoot
          npm install canvas@^2.11.2 --GTK_Root="$gtkRoot"

      - name: Build Windows application (reuse local build.bat)
        shell: cmd
        run: |
          set CI=1
          cd pc-version-final
          call build.bat
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Rename Windows artifacts to unified format
        run: |
          $distPath = "pc-version-final/dist"
          # 从 package.json 读取版本号
          $packageJson = Get-Content "pc-version-final/package.json" | ConvertFrom-Json
          $version = $packageJson.version
          Write-Host "Version from package.json: $version"
          
          Write-Host "Renaming Windows artifacts to unified format..."
          
          # 重命名 NSIS 安装程序: ImagePilot-win-amd-setup-${version}.exe
          $nsisFiles = Get-ChildItem -Path $distPath -Recurse -Include "*Setup*.exe" -ErrorAction SilentlyContinue
          foreach ($file in $nsisFiles) {
              $newName = "ImagePilot-win-amd-setup-$version.exe"
              $newPath = Join-Path $file.DirectoryName $newName
              if ($file.Name -ne $newName) {
                  Write-Host "Renaming: $($file.Name) -> $newName"
                  Rename-Item -Path $file.FullName -NewName $newName -ErrorAction SilentlyContinue
              }
          }
          
          # 重命名 Portable EXE: ImagePilot-win-amd-portable-${version}.exe
          $portableFiles = Get-ChildItem -Path $distPath -Recurse -Include "*.exe" -ErrorAction SilentlyContinue | 
                          Where-Object { $_.Name -notlike "*Setup*" -and $_.Name -like "ImagePilot*.exe" }
          foreach ($file in $portableFiles) {
              $newName = "ImagePilot-win-amd-portable-$version.exe"
              $newPath = Join-Path $file.DirectoryName $newName
              if ($file.Name -ne $newName) {
                  Write-Host "Renaming: $($file.Name) -> $newName"
                  Rename-Item -Path $file.FullName -NewName $newName -ErrorAction SilentlyContinue
              }
          }
          
          # 重命名 APPX (未签名): ImagePilot-win-amd-${version}.appx
          $unsignedAppx = Get-ChildItem -Path $distPath -Recurse -Include "*.appx" -ErrorAction SilentlyContinue | 
                         Where-Object { $_.Name -notlike "*-signed.appx" }
          foreach ($file in $unsignedAppx) {
              $newName = "ImagePilot-win-amd-$version.appx"
              if ($file.Name -ne $newName) {
                  Write-Host "Renaming: $($file.Name) -> $newName"
                  Rename-Item -Path $file.FullName -NewName $newName -ErrorAction SilentlyContinue
              }
          }
          
          # 重命名 APPX (签名): ImagePilot-win-amd-signed-${version}.appx
          $signedAppx = Get-ChildItem -Path $distPath -Recurse -Include "*-signed.appx" -ErrorAction SilentlyContinue
          foreach ($file in $signedAppx) {
              $newName = "ImagePilot-win-amd-signed-$version.appx"
              if ($file.Name -ne $newName) {
                  Write-Host "Renaming: $($file.Name) -> $newName"
                  Rename-Item -Path $file.FullName -NewName $newName -ErrorAction SilentlyContinue
              }
          }

      - name: Find Windows artifacts
        id: build
        run: |
          $distPath = "pc-version-final/dist"
          
          # 从 package.json 读取版本号
          $packageJson = Get-Content "pc-version-final/package.json" | ConvertFrom-Json
          $version = $packageJson.version
          Write-Host "Version from package.json: $version"
          Write-Host "Searching for Windows build artifacts in: $distPath"
          
          # NSIS Installer: ImagePilot-win-amd-setup-${version}.exe
          $nsisInstallers = Get-ChildItem -Path $distPath -Recurse -Include "ImagePilot-win-amd-setup-*.exe" -ErrorAction SilentlyContinue
          if ($nsisInstallers) {
              Write-Host "Found NSIS installers:"
              $nsisPaths = @()
              $nsisInstallers | ForEach-Object { 
                  Write-Host "  - $($_.FullName)"
                  $nsisPaths += $_.FullName
              }
              "nsis_paths<<EOF" >> $env:GITHUB_OUTPUT
              $nsisPaths | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
              "EOF" >> $env:GITHUB_OUTPUT
          }
          
          # Portable EXE: ImagePilot-win-amd-portable-${version}.exe
          $portableExes = Get-ChildItem -Path $distPath -Recurse -Include "ImagePilot-win-amd-portable-*.exe" -ErrorAction SilentlyContinue
          
          if ($portableExes) {
              Write-Host "Found Portable EXEs:"
              $portablePaths = @()
              $portableExes | ForEach-Object { 
                  Write-Host "  - $($_.FullName)"
                  $portablePaths += $_.FullName
              }
              "portable_paths<<EOF" >> $env:GITHUB_OUTPUT
              $portablePaths | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
              "EOF" >> $env:GITHUB_OUTPUT
          }
          
          # APPX packages - 分别处理未签名和签名版本
          # 未签名: ImagePilot-win-amd-${version}.appx
          # 签名: ImagePilot-win-amd-signed-${version}.appx
          $unsignedAppx = Get-ChildItem -Path $distPath -Recurse -Include "ImagePilot-win-amd-*.appx" -ErrorAction SilentlyContinue | 
                          Where-Object { $_.Name -notlike "*-signed.appx" }
          $signedAppx = Get-ChildItem -Path $distPath -Recurse -Include "ImagePilot-win-amd-signed-*.appx" -ErrorAction SilentlyContinue
          
          if ($unsignedAppx) {
              Write-Host "Found unsigned APPX:"
              $unsignedAppxList = @()
              $unsignedAppx | ForEach-Object {
                  Write-Host "  - $($_.FullName)"
                  $unsignedAppxList += $_.FullName
              }
              "unsigned_appx_paths<<EOF" >> $env:GITHUB_OUTPUT
              $unsignedAppxList | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
              "EOF" >> $env:GITHUB_OUTPUT
          }
          
          if ($signedAppx) {
              Write-Host "Found signed APPX:"
              $signedAppxList = @()
              $signedAppx | ForEach-Object {
                  Write-Host "  - $($_.FullName)"
                  $signedAppxList += $_.FullName
              }
              "signed_appx_paths<<EOF" >> $env:GITHUB_OUTPUT
              $signedAppxList | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
              "EOF" >> $env:GITHUB_OUTPUT
          }
          
          # 输出版本号供 artifact 名称使用
          "version=$version" >> $env:GITHUB_OUTPUT
          
          # 检查是否至少找到一个类型的制品
          $totalFound = 0
          if ($nsisInstallers) { $totalFound += $nsisInstallers.Count }
          if ($portableExes) { $totalFound += $portableExes.Count }
          if ($unsignedAppx) { $totalFound += $unsignedAppx.Count }
          if ($signedAppx) { $totalFound += $signedAppx.Count }
          
          Write-Host "Total artifacts found: $totalFound"
          
          if ($totalFound -eq 0) {
              Write-Error "No Windows build artifacts found in $distPath/"
              Write-Host "Available files in dist directory:"
              Get-ChildItem -Path $distPath -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table
              exit 1
          }

      - name: Upload NSIS Installer
        if: steps.build.outputs.nsis_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: ImagePilot-win-amd-setup-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.nsis_paths }}

      - name: Upload Portable EXE
        if: steps.build.outputs.portable_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: ImagePilot-win-amd-portable-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.portable_paths }}

      - name: Upload Unsigned APPX
        if: steps.build.outputs.unsigned_appx_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: ImagePilot-win-amd-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.unsigned_appx_paths }}

      - name: Upload Signed APPX
        if: steps.build.outputs.signed_appx_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: ImagePilot-win-amd-signed-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.signed_appx_paths }}