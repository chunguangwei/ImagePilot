# 仅用于手动触发。合并到「默认分支」(main/master) 后，在 Actions 左侧点本 workflow 名即可看到 "Run workflow"。
name: Manual Build (Run workflow)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options:
          - all
          - android
          - macos
          - windows

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set platform matrix
        id: set-matrix
        env:
          BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          case "$BUILD_PLATFORM" in
            all) echo 'matrix={"platform":["macos","windows","android"]}' >> "$GITHUB_OUTPUT" ;;
            android|macos|windows) echo "matrix={\"platform\":[\"$BUILD_PLATFORM\"]}" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported platform" >&2; exit 1 ;;
          esac

  build:
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      release_tag: ${{ github.sha }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
