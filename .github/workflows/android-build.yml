name: Android Build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      android_artifact_path:
        description: "Path to the Android APK"
        value: ${{ jobs.build-android.outputs.artifact_path }}

jobs:
  build-android:
    name: Build Android APK
    # 使用 Ubuntu：Windows 上 setup-android 下载常被 cancel，Linux 更稳定
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 增加超时时间，NDK 下载可能需要较长时间
    outputs:
      artifact_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # packages 必须用空格分隔，不能用逗号（逗号会导致 'build-tools;34.0.0,' 找不到）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-33 ndk;23.1.7779620'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
          fail-on-cache-miss: false

      # 注意：移除了 Android SDK 缓存，原因：
      # 1. Android SDK 文件非常大（包含 NDK、build-tools 等），缓存压缩会导致清理步骤超时
      # 2. android-actions/setup-android@v3 已经内置了 SDK 缓存机制
      # 3. SDK 下载通常比缓存压缩/上传更快

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          cd android && ./gradlew --version

      - name: Generate build info
        run: node scripts/generate-build-info.js

      - name: Check if signing secrets are configured
        id: check-secrets
        run: |
          # 检查 secret 是否存在（即使为空也会被传递，所以检查长度）
          KEYSTORE_BASE64="${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          echo "Debug: Checking ANDROID_KEYSTORE_BASE64 secret..."
          echo "Debug: Secret length: ${#KEYSTORE_BASE64}"
          
          if [ -n "$KEYSTORE_BASE64" ] && [ ${#KEYSTORE_BASE64} -gt 100 ]; then
            echo "secrets_configured=true" >> $GITHUB_OUTPUT
            echo "✅ Signing secrets are configured (length: ${#KEYSTORE_BASE64})"
          else
            echo "secrets_configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Signing secrets are not configured (length: ${#KEYSTORE_BASE64}), will build unsigned APK only"
          fi
          
          # 输出检查结果供调试
          echo "Debug: secrets_configured output will be:"
          cat $GITHUB_OUTPUT | grep secrets_configured || echo "secrets_configured not found in output"

      - name: Restore release keystore from secret
        run: |
          echo "🔐 Restoring release keystore from secret..."
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "❌ ANDROID_KEYSTORE_BASE64 未配置——无法产出签名 Release APK。"
            echo "   请在 仓库 Settings → Secrets and variables → Actions 配置 4 个 secret："
            echo "   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore
          ls -lh android/app/release.keystore

      - name: Build signed Android Release APK
        run: |
          cd android
          ./gradlew clean
          # 单条签名构建：keystore + 密码全部来自 GitHub Secrets（不再依赖仓库内 keystore）
          ./gradlew assembleRelease --no-daemon \
            -PMYAPP_RELEASE_STORE_FILE=release.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMYAPP_RELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMYAPP_RELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

          APK_DIR="app/build/outputs/apk/release"
          BUILT_APK=$(find "$APK_DIR" -name "*.apk" -type f | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            echo "❌ Error: 未产出 APK"
            find "$APK_DIR" -type f || echo "目录不存在"
            exit 1
          fi
          mkdir -p ../artifacts
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n 1)
          [ -z "$VERSION" ] && VERSION=$(node -p "require('../package.json').version")
          echo "Android version: $VERSION"
          cp "$BUILT_APK" "../artifacts/ImagePilot-android-arm-$VERSION.apk"
          echo "Signed APK saved: ../artifacts/ImagePilot-android-arm-$VERSION.apk"
          ls -lh "../artifacts/ImagePilot-android-arm-$VERSION.apk"
        env:
          JAVA_OPTS: '-Xmx2048m'

      - name: Find APK
        id: build
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -n 1)
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          [ -z "$VERSION" ] && VERSION="unknown"
          APK="artifacts/ImagePilot-android-arm-$VERSION.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ Error: 未找到 APK：$APK"
            ls -la artifacts/ || echo "artifacts 目录不存在"
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found signed APK: $APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ImagePilot-android-arm-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.apk_path }}