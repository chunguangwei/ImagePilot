name: Android Build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      android_artifact_path:
        description: "Path to the Android APK"
        value: ${{ jobs.build-android.outputs.artifact_path }}

jobs:
  build-android:
    name: Build Android APK
    # 使用 Ubuntu：Windows 上 setup-android 下载常被 cancel，Linux 更稳定
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 增加超时时间，NDK 下载可能需要较长时间
    outputs:
      artifact_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # packages 必须用空格分隔，不能用逗号（逗号会导致 'build-tools;34.0.0,' 找不到）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-33 ndk;23.1.7779620'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
          fail-on-cache-miss: false

      # 注意：移除了 Android SDK 缓存，原因：
      # 1. Android SDK 文件非常大（包含 NDK、build-tools 等），缓存压缩会导致清理步骤超时
      # 2. android-actions/setup-android@v3 已经内置了 SDK 缓存机制
      # 3. SDK 下载通常比缓存压缩/上传更快

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          cd android && ./gradlew --version

      - name: Generate build info
        run: node scripts/generate-build-info.js

      - name: Check if signing secrets are configured
        id: check-secrets
        run: |
          # 检查 secret 是否存在（即使为空也会被传递，所以检查长度）
          KEYSTORE_BASE64="${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          echo "Debug: Checking ANDROID_KEYSTORE_BASE64 secret..."
          echo "Debug: Secret length: ${#KEYSTORE_BASE64}"
          
          if [ -n "$KEYSTORE_BASE64" ] && [ ${#KEYSTORE_BASE64} -gt 100 ]; then
            echo "secrets_configured=true" >> $GITHUB_OUTPUT
            echo "✅ Signing secrets are configured (length: ${#KEYSTORE_BASE64})"
          else
            echo "secrets_configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Signing secrets are not configured (length: ${#KEYSTORE_BASE64}), will build unsigned APK only"
          fi
          
          # 输出检查结果供调试
          echo "Debug: secrets_configured output will be:"
          cat $GITHUB_OUTPUT | grep secrets_configured || echo "secrets_configured not found in output"

      - name: Build unsigned Android Release APK
        run: |
          cd android
          ./gradlew clean
          # 先构建未签名版本
          ./gradlew assembleRelease --no-daemon
          
          # 保存未签名版本到临时目录并重命名为统一格式
          APK_DIR="app/build/outputs/apk/release"
          UNSIGNED_APK=$(find "$APK_DIR" -name "*.apk" -type f | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            mkdir -p ../artifacts
            # 从 build.gradle 读取版本号（versionName）
            VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n 1)
            if [ -z "$VERSION" ]; then
              # 回退：从 package.json 读取
              VERSION=$(node -p "require('../package.json').version")
            fi
            echo "Android version: $VERSION"
            NEW_NAME="ImagePilot-android-arm-$VERSION.apk"
            cp "$UNSIGNED_APK" "../artifacts/$NEW_NAME"
            echo "Unsigned APK saved: ../artifacts/$NEW_NAME"
          fi
        env:
          JAVA_OPTS: '-Xmx2048m'

      - name: Debug check-secrets output
        run: |
          echo "Debug: check-secrets.outputs.secrets_configured = '${{ steps.check-secrets.outputs.secrets_configured }}'"
          echo "Debug: Condition check: steps.check-secrets.outputs.secrets_configured == 'true'"
          if [ "${{ steps.check-secrets.outputs.secrets_configured }}" == "true" ]; then
            echo "✅ Condition is TRUE - Setup signing step should run"
          else
            echo "❌ Condition is FALSE - Setup signing step will be skipped"
          fi

      - name: Setup signing (if secrets are configured)
        if: steps.check-secrets.outputs.secrets_configured == 'true'
        run: |
          echo "🔐 Setting up signing keystore..."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore
          if [ -f "android/app/release.keystore" ]; then
            echo "✅ Keystore file created successfully"
            ls -lh android/app/release.keystore
          else
            echo "❌ Failed to create keystore file"
            exit 1
          fi

      - name: Build signed Android Release APK (if secrets configured)
        if: steps.check-secrets.outputs.secrets_configured == 'true'
        run: |
          echo "🔐 Building signed Android Release APK..."
          cd android
          
          # 验证 keystore 文件存在（相对于 android/ 目录）
          if [ ! -f "app/release.keystore" ]; then
            echo "❌ Error: release.keystore not found at app/release.keystore"
            echo "Current directory: $(pwd)"
            echo "Files in app directory:"
            ls -la app/ || echo "app directory not found"
            exit 1
          fi
          echo "✅ Keystore file found at app/release.keystore"
          
          # 清理后重新构建签名版本
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon \
            -PMYAPP_RELEASE_STORE_FILE=release.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMYAPP_RELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMYAPP_RELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          
          if [ $? -ne 0 ]; then
            echo "❌ Error: Signed APK build failed"
            exit 1
          fi
          
          echo "✅ Signed APK build completed"
          
          # 保存签名版本到临时目录并重命名为统一格式
          APK_DIR="app/build/outputs/apk/release"
          SIGNED_APK=$(find "$APK_DIR" -name "*.apk" -type f | head -n 1)
          if [ -n "$SIGNED_APK" ]; then
            mkdir -p ../artifacts
            # 从 build.gradle 读取版本号（versionName）
            VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n 1)
            if [ -z "$VERSION" ]; then
              # 回退：从 package.json 读取
              VERSION=$(node -p "require('../package.json').version")
            fi
            echo "Android version: $VERSION"
            NEW_NAME="ImagePilot-android-arm-signed-$VERSION.apk"
            cp "$SIGNED_APK" "../artifacts/$NEW_NAME"
            echo "Signed APK saved: ../artifacts/$NEW_NAME"
            ls -lh "../artifacts/$NEW_NAME"
          else
            echo "⚠️ Warning: Signed APK not found in $APK_DIR"
            echo "Available files:"
            find "$APK_DIR" -type f || echo "Directory not found"
          fi
        env:
          JAVA_OPTS: '-Xmx2048m'

      - name: Find APKs
        id: build
        run: |
          # 确保 artifacts 目录存在
          mkdir -p artifacts
          
          # 从 build.gradle 读取版本号（versionName）
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            # 回退：从 package.json 读取
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "Android version: $VERSION"
          
          # 检查 artifacts 目录中的 APK 文件（统一格式）
          UNSIGNED_APK="artifacts/ImagePilot-android-arm-$VERSION.apk"
          SIGNED_APK="artifacts/ImagePilot-android-arm-signed-$VERSION.apk"
          
          if [ -f "$UNSIGNED_APK" ]; then
            echo "unsigned_apk=$UNSIGNED_APK" >> $GITHUB_OUTPUT
            echo "Found unsigned APK: $UNSIGNED_APK"
          else
            echo "⚠️ Warning: unsigned APK not found: $UNSIGNED_APK"
          fi
          
          if [ -f "$SIGNED_APK" ]; then
            echo "signed_apk=$SIGNED_APK" >> $GITHUB_OUTPUT
            echo "apk_path=$SIGNED_APK" >> $GITHUB_OUTPUT
            echo "Found signed APK: $SIGNED_APK"
          elif [ -f "$UNSIGNED_APK" ]; then
            echo "apk_path=$UNSIGNED_APK" >> $GITHUB_OUTPUT
            echo "Using unsigned APK as default"
          else
            echo "❌ Error: No APK found in artifacts directory"
            echo "Looking for: $UNSIGNED_APK or $SIGNED_APK"
            ls -la artifacts/ || echo "artifacts directory not found"
            exit 1
          fi
          [ -z "$VERSION" ] && VERSION="unknown"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: ImagePilot-android-arm-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.unsigned_apk }}

      - name: Upload signed APK (if available)
        if: steps.check-secrets.outputs.secrets_configured == 'true' && steps.build.outputs.signed_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: ImagePilot-android-arm-signed-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.signed_apk }}