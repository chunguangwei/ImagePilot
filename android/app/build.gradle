apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * 在构建前自动生成构建信息
 * 确保无论通过什么方式构建（npm run android、react-native run-android、Android Studio），都会更新构建版本
 */
task generateBuildInfo(type: Exec) {
    description = 'Generate build info before building'
    group = 'build'
    workingDir = rootProject.projectDir.parentFile
    commandLine = ['node', 'scripts/generate-build-info.js']
    doFirst {
        println "🔄 正在生成构建信息..."
    }
    doLast {
        println "✅ 构建信息生成完成"
    }
}

// 确保在构建前运行 generateBuildInfo
preBuild.dependsOn generateBuildInfo

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    cliFile = file("../../node_modules/react-native/cli.js")
}

/**
 * Set this to true to create four separate APKs instead of one,
 * one for each native architecture. This is useful if you don't
 * use App Bundles (https://developer.android.com/guide/app-bundle/)
 * and want to have separate APKs to upload to the Play Store.
 */
def enableSeparateBuildPerCPUArchitecture = false

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc:+'`
 *
 * The international variant includes ICU i18n library and icu4j data
 * with additional locales.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * 获取基于构建日期和时间的版本号
 * 格式：MMddHHmm（例如：11251430 表示 11月25日 14:30）
 * 使用月份、日期、小时、分钟，确保版本号在 int 范围内（最大 12312359）
 * 这样每次构建时版本号会自动更新，且可以从版本号看出构建的日期和时间
 * 确保同一天多次构建时版本号也不同，保证唯一性和递增性
 * 注意：不使用年份，因为年份会导致版本号超出 int 范围
 */
def getVersionCode = { ->
    try {
        def date = new Date()
        // 使用 SimpleDateFormat 确保格式正确
        def sdf = new java.text.SimpleDateFormat('MMddHHmm')
        def formattedDateTime = sdf.format(date)
        def versionCode = Integer.parseInt(formattedDateTime)
        def displayTime = new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm').format(date)
        println "构建版本号 (versionCode): ${versionCode} (构建时间: ${displayTime})"
        return versionCode
    } catch (Exception e) {
        println "警告: 无法生成基于日期时间的版本号，使用默认值 1. 错误: ${e.message}"
        e.printStackTrace()
        return 1
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.imageclassifier.v2"
    defaultConfig {
        applicationId "com.imageclassifier.v2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode getVersionCode()
        versionName "1.5.2"
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false  // If true, also generate a universal APK
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    
    signingConfigs {
        debug {
            // 使用默认的debug配置
        }
        release {
            // 支持通过 Gradle 属性或环境变量配置签名
            // 本地构建：使用 android-release-key.keystore
            // CI 构建：通过 Gradle 属性传递
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            } else if (file('../android-release-key.keystore').exists()) {
                // 本地构建：使用默认的 keystore 文件（位于 android/ 目录）
                storeFile file('../android-release-key.keystore')
                storePassword project.findProperty('MYAPP_RELEASE_STORE_PASSWORD') ?: 'image123'
                keyAlias project.findProperty('MYAPP_RELEASE_KEY_ALIAS') ?: 'imageclassifier'
                keyPassword project.findProperty('MYAPP_RELEASE_KEY_PASSWORD') ?: 'image123'
            }
        }
    }
    
    buildFeatures {
        buildConfig true
    }
    
    buildTypes {
        debug {
            // 使用默认签名配置
        }
        release {
            // 如果配置了签名，使用签名配置
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    
    // 模型不再随 APK 打包 —— 全部走 GH Release 按需下载（classifierModelSource）
    // public/ 里 initialSettings.json 已被 ConfigService 以 ES import 内联进 JS bundle，
    // 不需要再作为 Android assets 源，srcDirs 回到默认。
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    
    // 手动添加必要的模块依赖
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-safe-area-context')
    implementation project(':react-native-screens')
    implementation project(':react-native-async-storage')
    implementation project(':react-native-fast-image')
    implementation project(':react-native-fs')
    implementation project(':react-native-image-picker')
    implementation project(':react-native-image-resizer')
    implementation project(':react-native-vector-icons')
    implementation project(':react-native-sqlite-storage')
    implementation project(':onnxruntime-react-native')
    implementation project(':react-native-community-blur')

    // AndroidX ExifInterface - 用于读取图片EXIF信息（MediaStore需要）
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
   
}

