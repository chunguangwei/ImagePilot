// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 覆盖 R8 到支持 Java 21（class major 65）的版本 —— litertlm-android 是 Java 21 字节码，
        // AGP 8.1.1 自带的 R8 8.1.65 dex 不了会报 "Unsupported class file major version 65"。
        // 必须放在 AGP classpath 之前，且不升 AGP（避开 RN0.72 gradle-plugin 的 Kotlin 1.9 不兼容）。
        classpath("com.android.tools:r8:8.3.37")
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        // 阿里云 Google 镜像：国内更稳地拉 com.google.ai.edge.litertlm（Android 本地多模态分类档运行时）
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://www.jitpack.io' }
    }
}

// —— AGP 8 兼容：给缺少 namespace 的旧 RN 原生库自动从其 AndroidManifest 的 package 补上 ——
// AGP 8 要求每个 Android module 显式声明 namespace；RN 0.72 era 的部分库仍用 manifest 的 package=。
// 这里在各子工程评估后，若 android.namespace 为空则读其 manifest 的 package 回填，避免逐个 patch node_modules。
subprojects { subproject ->
    afterEvaluate {
        if (subproject.hasProperty("android")) {
            subproject.android {
                if (namespace == null) {
                    def manifestFile = subproject.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def matcher = (manifestFile.getText("UTF-8") =~ /package="(.+?)"/)
                        if (matcher.find()) {
                            namespace = matcher.group(1)
                        }
                    }
                }
            }
        }
    }
}

